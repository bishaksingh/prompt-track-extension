<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>AI Prompt Tracker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, sans-serif;
      width: 400px;
      background: #0f0f0f;
      color: #e8e8e8;
      min-height: 500px;
    }
    .header {
      padding: 14px 16px 10px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h2 { font-size: 15px; font-weight: 600; color: #fff; }
    .header span { font-size: 11px; color: #666; }
    .tabs {
      display: flex;
      border-bottom: 1px solid #222;
      background: #0f0f0f;
    }
    .tab {
      flex: 1;
      padding: 9px 4px;
      font-size: 12px;
      text-align: center;
      cursor: pointer;
      color: #666;
      border-bottom: 2px solid transparent;
      transition: all 0.15s;
    }
    .tab.active { color: #fff; border-bottom-color: #7c6aff; }
    .search-bar {
      padding: 10px 12px;
      border-bottom: 1px solid #1a1a1a;
    }
    .search-bar input {
      width: 100%;
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 6px 10px;
      color: #e8e8e8;
      font-size: 12px;
      outline: none;
    }
    .search-bar input:focus { border-color: #7c6aff; }
    .prompts-container {
      max-height: 320px;
      overflow-y: auto;
      padding: 8px;
    }
    .prompt-item {
      background: #1a1a1a;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 6px;
    }
    .prompt-item:hover { border-color: #333; }
    .prompt-top {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }
    .site-badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 8px;
      color: #fff;
    }
    .prompt-time { font-size: 10px; color: #555; margin-left: auto; }
    .prompt-text { font-size: 12px; color: #ccc; line-height: 1.5; }
    .prompt-actions {
      display: flex;
      gap: 6px;
      margin-top: 8px;
    }
    .btn-fav, .btn-del {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 4px;
      border: none;
      cursor: pointer;
      font-family: -apple-system, sans-serif;
    }
    .btn-fav { background: #2a2a1a; color: #f5c542; }
    .btn-fav.active { background: #f5c542; color: #000; font-weight: 600; }
    .btn-del { background: #2a1a1a; color: #ff6b6b; }
    .btn-del:hover { background: #3a1a1a; }
    .analytics { padding: 12px; }
    .stat-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 14px;
    }
    .stat-box {
      background: #1a1a1a;
      border: 1px solid #242424;
      border-radius: 8px;
      padding: 12px;
      text-align: center;
    }
    .stat-box .num { font-size: 22px; font-weight: 700; color: #7c6aff; }
    .stat-box .label { font-size: 10px; color: #666; margin-top: 2px; }
    .chart-title { font-size: 11px; color: #666; margin-bottom: 8px; }
    .bar-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }
    .bar-label { font-size: 11px; color: #888; width: 70px; }
    .bar-track { flex: 1; background: #1a1a1a; border-radius: 4px; height: 8px; }
    .bar-fill { height: 8px; border-radius: 4px; }
    .bar-count { font-size: 11px; color: #555; width: 20px; text-align: right; }
    .export-section { padding: 12px; }
    .export-title { font-size: 12px; color: #888; margin-bottom: 10px; }
    .export-btn {
      display: block;
      width: 100%;
      padding: 10px;
      margin-bottom: 8px;
      border-radius: 8px;
      border: 1px solid #2a2a2a;
      background: #1a1a1a;
      color: #e8e8e8;
      font-size: 13px;
      cursor: pointer;
      text-align: left;
      font-family: -apple-system, sans-serif;
    }
    .export-btn:hover { border-color: #7c6aff; color: #fff; }
    .bottom-bar {
      padding: 8px 12px;
      border-top: 1px solid #1a1a1a;
    }
    .clear-btn {
      width: 100%;
      padding: 7px;
      background: #2a1a1a;
      color: #ff6b6b;
      border: 1px solid #3a2a2a;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-family: -apple-system, sans-serif;
    }
    .empty { color: #444; font-size: 12px; text-align: center; padding: 30px 0; }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #0f0f0f; }
    ::-webkit-scrollbar-thumb { background: #2a2a2a; border-radius: 4px; }
  </style>
</head>
<body>
  <div class="header">
    <h2>AI Prompt Tracker</h2>
    <span id="totalCount">0 prompts</span>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="prompts">Prompts</div>
    <div class="tab" data-tab="favourites">Favourites</div>
    <div class="tab" data-tab="analytics">Analytics</div>
    <div class="tab" data-tab="export">Export</div>
  </div>

  <div id="tab-prompts">
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search prompts...">
    </div>
    <div class="prompts-container" id="promptsList"></div>
  </div>

  <div id="tab-favourites" style="display:none">
    <div class="prompts-container" id="favList"></div>
  </div>

  <div id="tab-analytics" style="display:none">
    <div class="analytics">
      <div class="stat-grid" id="statGrid"></div>
      <div class="chart-title">Prompts by site</div>
      <div id="barChart"></div>
    </div>
  </div>

  <div id="tab-export" style="display:none">
    <div class="export-section">
      <div class="export-title">Download your captured prompts</div>
      <button class="export-btn" id="exportCSV">Export as CSV</button>
      <button class="export-btn" id="exportJSON">Export as JSON</button>
      <button class="export-btn" id="exportTXT">Export as Text</button>
    </div>
  </div>

  <div class="bottom-bar">
    <button class="clear-btn" id="clearBtn">Clear All Prompts</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
